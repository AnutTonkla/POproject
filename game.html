<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Boss</title>
    <link rel="stylesheet" href="frontend\CSS\background.css">
    <link rel="stylesheet" href="frontend\CSS\navbar.css">
    <link rel="stylesheet" href="frontend\CSS\front.css">
    <link rel="stylesheet" href="frontend\CSS\charator.css"> 
    <link rel="stylesheet" href="frontend\CSS\game_style.css"> 
</head>
<body class="background-theme">

    <script type="module" src="frontend\Javascript\main_game.js"></script>
    <script src="frontend\Javascript\TiltEffect.js"></script>
    
    <div class="navbar-trigger">
        <span class="down-arrow">▼</span>
    </div>

    <nav class="navbar">
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li> 
        <li><a href="game.html">Play Math Battle</a></li> 
        <button id="theme-toggle">🎨</button>
    </ul>
    </nav>

    <main class="content">
        <div id="selection-screen" class="content-box">
            <h2 class="text-center">Select Your Hero</h2>
            <div class="character-container">
                <figure class="character-card" onclick="chooseJob('Knight')">
                    <img src="frontend\images\Gemini_Generated_Image_mb9infmb9infmb9i.png" alt="Knight" class="char-img">
                    <figcaption>
                        <h4>Knight</h4>
                        <p>เลขบวกลบง่ายๆ</p>
                    </figcaption>
                </figure>

                <figure class="character-card" onclick="chooseJob('Archer')">
                    <img src="frontend\images\Gemini_Generated_Image_3yvz5a3yvz5a3yvz.png" alt="Archer" class="char-img">
                    <figcaption>
                        <h4>Archer</h4>
                        <p>ตอบไวได้โบนัส (5 วินาที)</p>
                    </figcaption>
                </figure>

                <figure class="character-card" onclick="chooseJob('Mage')">
                    <img src="frontend\images\Gemini_Generated_Image_m3npmvm3npmvm3np.png" alt="Mage" class="char-img">
                    <figcaption>
                        <h4>Mage</h4>
                        <p>ตีแรง จำกัดเวลาสมการ x (5 วินาที)</p>
                    </figcaption>
                </figure>
            </div>
        </div>
    </main>

    <div id="game-screen" style="display: none;" class="content-box">
        <div class="boss-ui">
            <h2 id="boss-name">Kayn (Boss)</h2>
            <div class="hp-bar"><div id="boss-hp-fill"></div></div>
            <p>HP: <span id="boss-hp-text">500/500</span></p>
        </div>

        <div class="question-box">
            <div id="timer-display"> Time: 0.0s </div>

            <h1 id="display-question">Preparing Battle...</h1>
            <input type="number" id="answer-input" placeholder="?">
            <button id="submit-btn">Attack!</button>
        </div>

        <div class="player-ui">
            <h3 id="player-class-display">-</h3>
            <div class="hp-bar"><div id="player-hp-fill"></div></div>
            <p>HP: <span id="player-hp-text">0/0</span></p>
        </div>
    </div>

</body>
</html>
